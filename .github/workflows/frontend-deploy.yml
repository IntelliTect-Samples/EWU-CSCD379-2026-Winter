name: Frontend CI/CD (Azure Static Web Apps)

on:
  push:
    branches:
      - kmilton1/Assignment4
  pull_request:
    branches:
      - kmilton1/Assignment4

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        working-directory: src/web
        run: npm ci

      - name: Test
        working-directory: src/web
        run: npm run test:run

      - name: Generate static site
        working-directory: src/web
        env:
          NUXT_PUBLIC_API_BASE: ${{ secrets.NUXT_PUBLIC_API_BASE }}
        run: npm run generate

      - name: Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WONDERFUL_GROUND_02B56AA10 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload

          app_location: src/web/.output/public
          skip_app_build: true