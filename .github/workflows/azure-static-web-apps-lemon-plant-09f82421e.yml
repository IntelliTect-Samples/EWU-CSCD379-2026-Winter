name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - Assignment2
  workflow_dispatch:

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false

      - name: Use Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Install deps inside your app folder
      - name: npm install
        run: npm ci
        working-directory: wordle-app

      # Build static output
      # If your project uses `generate`, keep this.
      # If it uses `build`, change to `npm run build`.
      - name: generate
        run: npm run generate
        working-directory: wordle-app

      # Upload the already-built static output folder
      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_LEMON_PLANT_09F82421E }}
          action: "upload"
          skip_app_build: true
          app_location: "wordle-app/.output/public"
